name: v0.38 boxed IPC framing and durable attempt receipts (NO execution)
on:
  pull_request:
    paths:
      - "src/minionone/boxed_ipc_v038.py"
      - "src/minionone/boxed_ipc_journal_v038.py"
      - "tests/test_boxed_ipc_v038.py"
      - ".github/workflows/boxed-ipc-v038.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-boxed-ipc:
    name: Boxed IPC hostile frame and crash receipt tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact source
        run: python -m pip install --disable-pip-version-check -e .
      - name: Require strict IPC protocol and journal tests
        run: python -m unittest discover -s tests -p test_boxed_ipc_v038.py -v
      - name: Require no executable worker capability or attestable IPC success
        shell: python
        run: |
          from minionone.boxed_tool_policy import WorkerToolGrant
          from minionone.boxed_ipc_journal_v038 import BoxedProbeJournal
          from pathlib import Path
          import tempfile
          for kind in ("ISOLATED_TEST","WORKSPACE"):
              grant=WorkerToolGrant.for_job_kind(kind)
              assert not grant.permits("execute_shell")
              assert not grant.permits("run_tests")
              assert grant.execution_enabled is False
          with tempfile.TemporaryDirectory() as d:
              j=BoxedProbeJournal(Path(d)/"journal.sqlite3")
              g=j.prepare("JOB-"+"a"*32,"ATT-"+"b"*32,"OP-"+"c"*32)
              j.before_dispatch(g)
              status=BoxedProbeJournal(Path(d)/"journal.sqlite3").status(
                  g.job_id,g.attempt_id,g.operation_id)
              assert status.state=="IN_FLIGHT"
              assert status.automatic_replay_allowed is False
              assert status.result_ready is False
              assert status.os_sandbox_attested is False
          print("V038_PROTOCOL_AND_JOURNAL_ONLY; EXECUTION=DISABLED; PRODUCT_GO=NO")
