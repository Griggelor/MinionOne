name: v0.39 real Windows AppContainer fixed-child IPC (NO WORKER EXEC)
on:
  pull_request:
    paths:
      - "src/minionone/win32_boxed_ipc_v039.py"
      - "tests/native/boxed_ipc_child_v039.c"
      - "tests/test_win32_boxed_ipc_v039.py"
      - "scripts/build_win32_ipc_v039.py"
      - ".github/workflows/boxed-ipc-v039.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-child-ipc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact source
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile fixed helper (NOT worker executable)
        run: python scripts/build_win32_ipc_v039.py
      - name: Actual Windows AppContainer IPC roundtrip through explicit handles
        env:
          MINIONONE_V039_NATIVE: "1"
        run: python -m unittest discover -s tests -p test_win32_boxed_ipc_v039.py -v
      - name: v0.38 framed protocol and no-replay regressions
        run: python -m unittest discover -s tests -p test_boxed_ipc_v038.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v039-windows-fixed-child-ipc-evidence
          path: evidence/v039/IPC_RESULT.json
          if-no-files-found: ignore

  linux-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact source
        run: python -m pip install --disable-pip-version-check -e .
      - name: Reject OS transport on non-Windows and executable tool grants
        run: python -m unittest discover -s tests -p test_win32_boxed_ipc_v039.py -v
      - name: Existing v0.38 protocol and journal tests
        run: python -m unittest discover -s tests -p test_boxed_ipc_v038.py -v
