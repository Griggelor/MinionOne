# Synthetic HTTP E2E: BOTH workspace routes, full manager/provider/tool/filesystem/ACK.
# Never claim target G1/G3 Unsloth or real Flint from this deterministic fixture.
name: Full bridge HTTP E2E (synthetic)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  both-delegation-paths:
    env:
      MINIONONE_TEST_EVIDENCE_DIR: evidence/bridge-failures
    name: MCP-to-worker HTTP and filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact checkout
        run: python -m pip install --disable-pip-version-check -e .
      - name: Genuine HTTP MCP - manager - worker HTTP - broker - native files - ACK
        run: python -m unittest discover -s tests -p test_full_bridge_http_e2e_ci.py -v
      - name: CLI subprocess integration with real network sockets
        run: python -m unittest discover -s tests -p test_cli_subprocess_bridge_e2e.py -v
      - name: Three Windows stability passes; each strict report belongs to its own run
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess, sys
          for attempt in range(1,4):
              subprocess.run([sys.executable,'-m','unittest','discover','-s','tests',
                              '-p','test_cli_subprocess_bridge_e2e.py','-v'],check=True)
              subprocess.run([sys.executable,'scripts/run_workfiles_v031.py','--strict',
                              '--out',f'evidence/bridge-stability/pass-{attempt}'],check=True)
      - name: Preserve redacted failure metadata and strict per-pass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-diagnostics-${{ matrix.os }}
          path: |
            evidence/bridge-failures/
            evidence/bridge-stability/
          if-no-files-found: ignore
      - name: Identify platform and commit for non-secret evidence
        shell: python
        run: |
          import os, platform
          print("CI_HARDWARE_GATE=NO_GO")
          print("CI_MODEL_PROVIDER=DETERMINISTIC_LOOPBACK_HTTP_NOT_REAL_FLINT")
          print("CI_PARENT=HTTP_MCP_HARNESS_NOT_REAL_UNSLOTH")
          print("CI_OS=" + platform.platform())
          print("CI_COMMIT=" + os.environ.get("GITHUB_SHA","unknown"))
