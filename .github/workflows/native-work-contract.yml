# TEST-FIRST: this collector is green when evidence is captured, even while
# the substantive WF-001..003 target contract is red. The STRICT MODE exits 2.
# Never interpret this workflow as product-ready.
name: Native Work product contract evidence (RED until implemented)
on:
  pull_request:
    paths:
      - 'src/minionone/**'
      - 'product_acceptance/**'
      - 'tests/test_full_bridge_http_e2e_ci.py'
      - 'scripts/run_workfiles_v031.py'
      - 'docs/SPEC_V031_FILESYSTEM_FIRST_TESTFIRST.md'
      - '.github/workflows/native-work-contract.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  collect-real-work-evidence:
    runs-on: ${{ matrix.os }}
    name: Native Work evidence (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install exact candidate; no real user content
        run: python -m pip install --disable-pip-version-check -e .
      - name: Execute three positive real-work target cases; collect actual RED/PASS evidence
        run: python scripts/run_workfiles_v031.py --out evidence/v031-workfiles
      - name: Verify evidence schema, all 3 cases really executed and no false release claim
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('evidence/v031-workfiles/WORKFILES_V031_EVIDENCE.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['execution']['executed']==3,r['execution']
          assert r['test_ids']==['WF-001','WF-002','WF-003'],r['test_ids']
          assert r['product_release']=='NO_GO'
          assert r['customer_product_ready'] is False
          assert len(r['cases'])==16
          assert all(c['result'] in ('FAIL_TARGET_CONTRACT','PASS_SYNTH_HTTP_CONTRACT_NOT_TARGET_HOST')
                     for c in r['cases'][:3])
          print('EVIDENCE_COLLECTED_ONLY; WORK_PRODUCT_GO=NO; RESULT='+r['contract_result'])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v031-workfiles-target-evidence-${{ matrix.os }}
          path: evidence/v031-workfiles/
          if-no-files-found: error
