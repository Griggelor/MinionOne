name: Official MCP SDK protocol interoperability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-clients:
    name: MCP SDK ${{ matrix.sdk }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        sdk: ["1.30.0", "2.3.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install app and pinned official MCP client
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check "mcp==${{ matrix.sdk }}"
      - name: Official MCP SDK initialize, list_tools, call_tool
        run: python integration_tests/official_mcp_client.py

# All calls are localhost with synthetic data; NO live Unsloth, no
# parent chat identity attestation, and no file/worker execution.
