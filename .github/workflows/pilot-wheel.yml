name: Build installable MCP pilot wheel (NOT a beta release)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-os-contracts:
    name: Required tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install and test the exact checkout
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v

  build-pilot:
    needs: dual-os-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install project in editable mode before testing
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test all included offline modules before packaging
        run: python -m unittest discover -s tests -v
      - name: Build isolated distribution
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test installed wheel in clean directory
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          python -c 'from minionone.mcp_server import LocalMCP; from minionone.mcp_cli import main; print("PILOT_WHEEL_IMPORT_OK")'
          python -m minionone.mcp_cli --help
      - name: SHA-256 checksum of pilot wheel
        shell: bash
        run: |
          python -c 'import hashlib,pathlib; p=next(pathlib.Path("dist").glob("*.whl")); pathlib.Path("dist/SHA256SUMS.txt").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")'
      - name: Upload package strictly as a CI artifact, not a signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MinionOne-MCP-PILOT-UNVERIFIED-0.12.0.dev0
          path: dist/
          retention-days: 14
          if-no-files-found: error
