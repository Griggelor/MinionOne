name: Native Win32 AppContainer hostile access probes v0.37
on:
  pull_request:
    paths:
      - "src/minionone/win32_appcontainer_adversarial_v037.py"
      - "tests/native/appcontainer_adversary_v037.c"
      - "tests/test_win32_appcontainer_adversarial_v037.py"
      - "scripts/build_win32_adversary_v037.py"
      - ".github/workflows/win32-appcontainer-adversarial-v037.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-appcontainer-denials:
    name: Native AppContainer host/foreign-file and loopback denial v037
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile fixed standalone test helper via MSVC
        run: python scripts/build_win32_adversary_v037.py --out evidence/v037/appcontainer_adversary_v037.exe
      - name: Actual Windows AppContainer adversarial tests (fail closed)
        env:
          MINIONONE_V037_NATIVE: "1"
        run: python -m unittest discover -s tests -p test_win32_appcontainer_adversarial_v037.py -v
      - name: Re-run independent denial probe and emit redacted proof
        shell: python
        run: |
          from minionone.win32_appcontainer_adversarial_v037 import run_fixed_adversarial_access_probe
          from dataclasses import asdict
          from pathlib import Path
          import json
          e=asdict(run_fixed_adversarial_access_probe())
          for field in ("real_appcontainer_token", "assigned_before_resume",
                        "manager_canary_read_denied", "sibling_canary_read_denied",
                        "output_canary_write_denied",
                        "ordinary_host_positive_control", "canary_integrity_preserved",
                        "process_exited"):
              assert e[field] is True, field
          assert e["loopback_connect_denied"] or e["loopback_connect_timed_out"]
          assert e["network_denial_verified"] == e["loopback_connect_denied"]
          assert e["worker_tool_exposed"] is False
          assert e["host_security_attested"] is False
          assert e["product_release"]=="NO_GO"
          proof={"schema_version":1,"evidence_kind":"SYNTHETIC_NATIVE_ACCESS_DENIAL",
                 "actual_target_host_approved":False,"sandbox_worker_enabled":False,
                 "product_release":"NO_GO","checks":e}
          p=Path("evidence/v037/SYNTHETIC_DENIAL_REPORT.json")
          p.write_text(json.dumps(proof,indent=2,sort_keys=True),encoding="utf-8")
          print("APP_CONTAINER_SYNTHETIC_FILE_DENIAL_MET; LOOPBACK_ATTEMPT_OBSERVED; NETWORK_ATTESTATION="+str(e["network_denial_verified"])+"; PRODUCT_GO=NO")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-native-appcontainer-denials-v037
          path: evidence/v037/SYNTHETIC_DENIAL_REPORT.json
          if-no-files-found: ignore
