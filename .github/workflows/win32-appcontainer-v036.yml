name: Windows AppContainer token proof v0.36 (NOT release)
on:
  pull_request:
    paths:
      - "src/minionone/win32_appcontainer_probe.py"
      - "src/minionone/win32_job_object_probe.py"
      - "tests/test_win32_appcontainer_probe_v036.py"
      - ".github/workflows/win32-appcontainer-v036.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appcontainer-token:
    name: Native AppContainer child token on Windows (no worker rights)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact source
        run: python -m pip install --disable-pip-version-check -e .
      - name: Native AppContainer token tests
        run: python -m unittest discover -s tests -p test_win32_appcontainer_probe_v036.py -v
      - name: Require token proof and write exact source evidence
        shell: python
        run: |
          from minionone.win32_appcontainer_probe import run_fixed_appcontainer_token_probe
          from dataclasses import asdict
          from pathlib import Path
          import json
          r=asdict(run_fixed_appcontainer_token_probe())
          assert r['token_is_appcontainer'] is True
          assert r['job_attached_before_resume'] is True
          assert r['process_exited'] is True
          assert r['worker_tool_exposed'] is False
          assert r['os_sandbox_attested'] is False
          assert r['network_denial_verified'] is False
          assert r['foreign_fs_denial_verified'] is False
          proof={"schema_version":1,"test_type":"WIN32_APPCONTAINER_TOKEN_ONLY",
                 "product_release":"NO_GO","host_access_attested":False,"proof":r}
          p=Path("evidence/v036-appcontainer-token/RESULT.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(proof,sort_keys=True,indent=2),encoding="utf-8")
          print("APPCONTAINER_TOKEN_NATIVE_PASS; NETWORK_FS_DENIAL=UNVERIFIED; PRODUCT_GO=NO")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-appcontainer-token-v036
          path: evidence/v036-appcontainer-token/
          if-no-files-found: ignore
