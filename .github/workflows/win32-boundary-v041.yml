name: v0.41 Win32 AppContainer handle, breakaway and loopback evidence
on:
  pull_request:
    paths:
      - "src/minionone/win32_boxed_ipc_v039.py"
      - "tests/native/boxed_ipc_child_v039.c"
      - "tests/test_win32_boundary_v041.py"
      - "scripts/build_win32_ipc_v039.py"
      - ".github/workflows/win32-boundary-v041.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-windows-boundary-controls:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install source
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile fixed developer-owned child (MSVC)
        run: python scripts/build_win32_ipc_v039.py
      - name: Real kernel handle inheritance, breakaway and loopback evidence
        env:
          MINIONONE_V041_NATIVE: "1"
        run: python -m unittest discover -s tests -p test_win32_boundary_v041.py -v
      - name: Preserve v0.39 real IPC success
        env:
          MINIONONE_V039_NATIVE: "1"
        run: python -m unittest discover -s tests -p test_win32_boxed_ipc_v039.py -v
      - name: Preserve v0.40 native hostile frame/crash fault matrix
        env:
          MINIONONE_V040_NATIVE: "1"
        run: python -m unittest discover -s tests -p test_win32_boxed_faults_v040.py -v
      - name: Preserve v0.38 journal replay protections
        run: python -m unittest discover -s tests -p test_boxed_ipc_v038.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v041-windows-boundary-observations
          path: evidence/v041/BOUNDARY_EVIDENCE.json
          if-no-files-found: ignore

  linux-deny-by-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install source
        run: python -m pip install --disable-pip-version-check -e .
      - name: No platform/security claim, no execution-capable worker grant
        run: python -m unittest discover -s tests -p test_win32_boundary_v041.py -v
      - name: Protocol and no-replay regression
        run: python -m unittest discover -s tests -p test_boxed_ipc_v038.py -v
