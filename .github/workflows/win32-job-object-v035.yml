name: Win32 bounded process lifecycle v0.35 (NOT sandbox)
on:
  pull_request:
    paths:
      - "src/minionone/win32_job_object_probe.py"
      - "tests/test_win32_job_object_probe_v035.py"
      - "scripts/run_win32_job_probe.py"
      - ".github/workflows/win32-job-object-v035.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32-job-lifecycle:
    name: Win32 suspended-start-and-kill proof (not access sandbox)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install exact checkout
        run: python -m pip install --disable-pip-version-check -e .
      - name: Native Windows job-object unit tests
        run: python -m unittest discover -s tests -p test_win32_job_object_probe_v035.py -v
      - name: Require real native lifecycle proof and no sandbox claim
        run: python scripts/run_win32_job_probe.py --out evidence/win32-job-v035/REPORT.json
      - name: Verify fail-closed evidence flags
        shell: python
        run: |
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/win32-job-v035/REPORT.json").read_text())
          assert len(r["cases"])==3
          assert r["product_release"]=="NO_GO"
          assert r["runner_attested"] is False
          assert r["appcontainer_attested"] is False
          assert r["worker_execution_enabled"] is False
          assert all(x["job_attached_before_resume"] is True for x in r["cases"])
          assert all(x["os_sandbox_attested"] is False for x in r["cases"])
          print("WIN32_NATIVE_JOB_ONLY; APP_CONTAINER_G1B=NOT_PROVEN")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-job-lifecycle-v035
          path: evidence/win32-job-v035/
          if-no-files-found: ignore
