name: G1b Win32 handle feasibility (NOT a security gate PASS)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win32-handle-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Win32 handle API feasibility on runner only
        run: python scripts/windows_handle_feasibility.py

# A green feasibility run is NOT Windows file-broker conformance. Tests that
# cannot create symlinks explicitly skip and leave G1b BLOCKED. There is
# no security claim about concurrent rename races, hardlink escape control,
# ACL isolation, volume replacement, filter drivers, or target Windows hardware.

      - name: Install MinionOne test candidate
        run: python -m pip install -e .
      - name: Native NTFS root-relative read-only broker adversarial tests (runner evidence only)
        run: python -m unittest discover -s tests -p test_win32_input_broker.py -v
