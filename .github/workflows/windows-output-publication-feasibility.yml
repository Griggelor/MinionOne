name: Native Windows manager output publication feasibility (NOT product gate)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-output-publication:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Windows manager-only publication adversarial tests
        run: python -m unittest discover -s tests -p test_win32_output_publication.py -v

# Synthetic ADMITTED rows are used only for this test fixture. A passing runner
# never authorizes worker tools, Windows input sealing, or target-host G1b PASS.
