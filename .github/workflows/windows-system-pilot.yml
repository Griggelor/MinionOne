name: Windows complete system-test package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install and test source
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -v
      - name: Install pinned executable builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 altgraph==0.17.4 packaging==25.0 pyinstaller-hooks-contrib==2025.9 pefile==2023.2.7 pywin32-ctypes==0.2.3 setuptools==80.9.0
      - name: Build wheel and native one-folder application
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m PyInstaller --noconfirm --clean --onedir --console --name MinionOne --paths src --distpath native-dist --workpath native-build --specpath native-build system_test/launcher.py
          python scripts/collect_runtime_licenses.py native-dist/MinionOne/THIRD_PARTY
      - name: Test actual frozen app, child process, credential and result ZIP
        run: python integration_tests/frozen_pilot_e2e.py --exe native-dist/MinionOne/MinionOne.exe --report dist/FROZEN_SYSTEM_TEST.json
      - name: Build install-free Windows test package
        run: python scripts/build_system_test_bundle.py --wheel dist/minionone-0.22.0.dev0-py3-none-any.whl --app native-dist/MinionOne --evidence dist/FROZEN_SYSTEM_TEST.json --output dist/MinionOne_Windows_SystemTest_0.22.0.dev0.zip
      - name: Package checksum
        run: python -c "import hashlib,pathlib; p=pathlib.Path('dist/MinionOne_Windows_SystemTest_0.22.0.dev0.zip'); pathlib.Path('dist/MinionOne_Windows_SystemTest_0.22.0.dev0.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MinionOne-Windows-SystemTest-0.22.0.dev0
          path: |
            dist/MinionOne_Windows_SystemTest_0.22.0.dev0.zip
            dist/MinionOne_Windows_SystemTest_0.22.0.dev0.sha256
            dist/FROZEN_SYSTEM_TEST.json
          if-no-files-found: error
          retention-days: 30
