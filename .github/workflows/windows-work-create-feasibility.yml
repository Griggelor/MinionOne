name: Windows work-file creation feasibility (NOT release gate)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-work-file-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install local package
        run: python -m pip install -e .
      - name: Windows create-only file tests
        run: python -m unittest discover -s tests -p test_win32_work_create_probe.py -v

# Runner success proves only this Windows feasibility slice. The workflow
# never enables the Windows job seal, worker filesystem access or publication.
