name: Native Windows workspace admission and input seal (NOT target G1b)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win32-seal-admission:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install MinionOne
        run: python -m pip install -e .
      - name: Native Windows canonical seal and MCP test cases
        run: python -m unittest discover -s tests -p test_win32_workspace_sealing.py -v

# Only synthetic files and runner-local database are used. Worker execution,
# provider integration and Windows target-host security approval remain blocked.
