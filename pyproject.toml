[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minionone"
version = "0.14.0.dev0"
description = "Experimental local multi-agent delegation manager; fail-closed pre-alpha"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "MinionOne contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.scripts]
minionone = "minionone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["minionone*"]
